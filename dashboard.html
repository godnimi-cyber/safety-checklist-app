<style>
/* 대시보드 전용 스타일 — 색은 styles.css :root 변수(승인 팔레트)만 쓴다(틴트는 흑백 알파만).
   앱 셸(.app-shell)과 무관한 독립 레이아웃. 내부 도구: 미관보다 상태 가시성 —
   장식 대신 위계(요약 타일 → 표), 카드 구획, 절제된 상태색으로 정돈한다. */
/* 토큰은 ./design-kit/tokens.css(킷 소비) — 이 파일에 색·수치 원값을 적지 않는다.
   계약 검사: web/design-kit/verify.mjs (raw 색·rgba·focus 제거 금지). */
/* 아래 여백은 **떠 있는 일괄 막대의 자리**다 — 막대 높이 + 띄운 간격 + 숨.
   여백을 고정으로 잡아 두는 대신 막대가 나타날 때 늘리면, 그 순간 목록이 밀린다.
   높이를 66px 로 **못 박지 않는다**: 글자를 키우거나 폭이 더 좁으면 버튼이 한 줄 더 접혀
   막대가 두꺼워지고, 그만큼 마지막 행·쪽 나눔 버튼이 덮여 영영 못 누르는 것이 된다
   (Codex 델타 검토 High, 2026-08-28). --od-bulkbar-h 는 odBarSpace_() 가 실측해 넣는다.
   여백은 행 **아래**라, 늘어나도 행을 밀지 않는다. 앞 줄의 96px 는 calc·env 를 못 읽는
   브라우저용 대체값이다(막대 66 + 12 + 18). */
.dash-shell { max-width: 1320px; margin: 0 auto; padding: 12px 20px 96px;
  padding-bottom: calc(var(--od-bulkbar-h, 66px) + max(12px, env(safe-area-inset-bottom, 12px)) + 18px);
  font-family: var(--font-body); }
.dash-topbar h1, .dash-block h2, .dash-tile .v, .dash-modal-head h2 {
  font-family: var(--font-heading); }
/* 앱 styles.css 의 전역 main 패딩(하단 액션바 공간)이 #dash-blocks 에 끼어들어
   표들만 안쪽으로 밀린다 — 이 페이지에서는 무효화한다(폭 정렬의 전제). */
.dash-shell main { padding: 0; }
/* W1(2026-09-17) — 「이번 주」·「오늘 제출된 점검」 반폭(D2)을 걷어내고 전폭 1열로
   통일한다(사용자 지시: 오늘 제출을 전폭으로. 오늘 제출만 바꾸면 이번 주가 홀로 반폭으로
   남아 우측 650px 가 비어 더 어색해진다 — 허브 실측·vision 판독으로 두 블록 모두 전폭
   채택, SAFETY-CHECKLIST W1~W5). 아래는 D2/T1/T2/U1/U2(반폭 전용 2열 그리드·열폭 고정·
   줄바꿈·점검일 열 숨김·배지)였다 — dashboard.js 가 더는 어떤 블록에도 dash-block-half 를
   주지 않으므로 전부 죽은 규칙이라 지웠다. 전폭에서는 table-layout 기본값(auto)만으로
   말줄임 0·가로 넘침 0 실측 확인(공사 열도 1줄) — 별도 규칙이 필요 없다. 점검일 열은
   전폭에서 늘 보이므로 숨김·배지도 함께 걷어냈다(dashboard.js 배지 생성 로직도 제거,
   .dash-today-badge 규칙도 없앴다). 부적합 우측 정렬은 .dash-today-live 스코프로 옮겨
   살렸다(아래 .dash-num 규칙, W2 — 「협력회사별」·「공사별」은 그 클래스를 받지 않으므로
   정렬이 그대로 불변이다, 판정 9). */
/* 음영은 제목 바 전용(사용자 지시) — 본문 카드는 보더로만 구획한다 */
/* sticky 고정 해제(사용자 지시 2026-08-10) — 모바일에서 헤더가 화면 위를 상시 점유했다 */
/* 헤더 3안(사용자 지시 2026-09-17) — 짙은 톤 그라디언트 + 도트 패턴 + 하단 accent 라인.
   --topbar-fg/--topbar-chip/--topbar-danger-bg 로 전경·배지·danger 칩을 변수화한 것은
   장식이 아니라 **다크 모드 반전 대응**이다: [data-theme="dark"] 에서는 --accent/--danger
   가 밝은 톤으로 뒤집히므로(대시보드 밖 요소가 짙은 배경 위에서 읽히게 하려는 설계) 라이트
   모드와 같은 색 조합을 그대로 쓰면 밝은 배경에 밝은 글자가 겹친다 — 실측(PIL, 스크린샷
   픽셀 샘플)으로 라이트/다크 각각 대비를 잡았다. */
.dash-topbar {
  --topbar-fg: var(--on-accent);
  --topbar-chip: color-mix(in srgb, var(--text) 32%, transparent);
  --topbar-danger-bg: color-mix(in srgb, var(--on-accent) 88%, transparent);
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  position: relative; overflow: hidden;
  border-radius: 12px; padding: 26px 24px; margin-bottom: 16px;
  border-bottom: 3px solid var(--ok);
  background: linear-gradient(120deg, color-mix(in srgb, var(--text) 92%, var(--accent)) 0%,
    color-mix(in srgb, var(--text) 70%, var(--accent)) 52%, color-mix(in srgb, var(--accent) 88%, var(--text)) 100%);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--text) 18%, transparent); }
/* 다크 모드 전용 그라디언트 — --text/--accent 조합을 그대로 쓰면(라이트와 동일 공식)
   다크 토큰에서 --text 가 밝고 --accent 가 밝은 민트라 "짙은 톤" 의도가 뒤집혀 밝은
   그라디언트가 된다(실측 확인). --surface/--bg(다크에서도 어두운 토큰)를 축으로 섞어
   짙은 톤을 유지한다. */
[data-theme="dark"] .dash-topbar {
  --topbar-fg: var(--text);
  --topbar-chip: color-mix(in srgb, var(--bg) 55%, transparent);
  --topbar-danger-bg: color-mix(in srgb, var(--bg) 70%, transparent);
  background: linear-gradient(120deg, color-mix(in srgb, var(--surface) 88%, var(--accent)) 0%,
    color-mix(in srgb, var(--surface) 60%, var(--accent)) 52%, color-mix(in srgb, var(--bg) 82%, var(--accent)) 100%);
}
.dash-topbar::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .10;
  background-image: radial-gradient(color-mix(in srgb, var(--topbar-fg) 100%, transparent) 1px, transparent 1px);
  background-size: 18px 18px; }
.dash-topbar > * { position: relative; z-index: 1; }
.dash-topbar h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em;
  color: var(--topbar-fg); margin: 0; }
/* 배지 칩은 --topbar-chip(항상 짙은 톤 축)을 쓴다 — --topbar-fg 를 그대로 섞으면 다크
   모드에서 글자색과 배지 배경이 같은 밝은 토큰(var(--text))을 공유해 밝은 글자 위에
   밝은 배지가 겹친다(실측 확인, §Z2). */
#dash-generated { color: var(--topbar-fg); font-size: 0.82rem;
  background: var(--topbar-chip); padding: 4px 12px; border-radius: 999px; }
.dash-topbar .spacer { flex: 1; }
.dash-topbar .dash-btn { background: color-mix(in srgb, var(--topbar-fg) 12%, transparent);
  border-color: color-mix(in srgb, var(--topbar-fg) 70%, transparent); color: var(--topbar-fg); }
.dash-topbar .dash-btn:hover { background: color-mix(in srgb, var(--topbar-fg) 26%, transparent); border-color: var(--topbar-fg); }
.dash-topbar .dash-btn:focus-visible { outline-color: var(--topbar-fg); }
/* 파괴적 조치 — 간격으로 떼고(오탭 방지) 테두리·글자로도 구분한다. danger 칩은
   --topbar-danger-bg(라이트=밝은 칩, 다크=짙은 칩) — --danger 토큰 자체가 모드마다
   밝기가 뒤집히므로(라이트=짙은 빨강, 다크=밝은 코랄) 칩도 반대로 뒤집어야 대비가
   유지된다(실측 확인). */
.dash-topbar .dash-btn-danger {
  margin-left: 28px;
  background: var(--topbar-danger-bg);
  color: var(--danger);
  border-color: var(--danger);
}
.dash-topbar .dash-btn-danger:hover { background: var(--surface); border-color: var(--surface); }
.dash-btn { min-height: 44px; padding: 0 18px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--surface); color: var(--text);
  cursor: pointer; font-size: 0.95rem; font-weight: 600;
  transition: background 0.15s, border-color 0.15s; }
/* 아이콘(V1, V6 감량 후 섹션 제목 전용) — stroke=currentColor 라 놓인 자리의 color 를
   그대로 받는다(팔레트 발명 0). order:-1 은 renderBlock_/renderOverdue_ 가 h.textContent
   재대입 뒤에 아이콘을 마지막 자식으로 붙여야 하는 사정(주석 참조) 때문에 필요하다 —
   DOM 순서와 무관하게 항상 글자 앞에 오게 한다. */
.dash-icon { flex: none; order: -1; }
.dash-btn:hover { background: var(--bg); border-color: var(--muted); }
.dash-btn:active { background: var(--row-hover); }
.dash-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 월간 리포트 — 수행과 미점검확정을 **표 두 개**로 가른다(사용자 지시 2026-08-19).
   합쳐서 '상태' 열을 두면 점검 2건 + 확정 1건인 공사의 상태를 한 값으로 못 적는다. */
.dash-mr-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.dash-mr-bar label { font-size: 13px; color: var(--muted); }
.dash-mr-bar input { min-height: 44px; padding: 0 12px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--surface); color: var(--text);
  font-family: var(--font-body); font-size: 0.95rem;
  transition: border-color 0.15s; }
.dash-mr-bar input:hover { border-color: var(--muted); }
.dash-mr-bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dash-mr-sum { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
/* 두 타일은 **나란히**다 — 위아래로 쌓으면 아래 것이 위 것의 부속처럼 읽힌다.
   미점검확정 타일만 색을 달리해 실적과 섞이지 않게 한다(합계 타일을 두지 않는 이유와 같다). */
/* V5 라운드 스케일 — 블록급 카드(.dash-block·.dash-tile·.dash-mr-tile)는 12px, 그 안의
   상호작용 요소(행·버튼·표 감쌈·페이저·카드형 행)는 10px, 오버레이(모달·키 화면)는 16px.
   기존에 10px였던 이 타일을 블록급으로 올려 규칙에 맞춘다(그 전엔 10/12 혼재였다). */
.dash-mr-tile { flex: 1 1 220px; border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; background: var(--surface); }
.dash-mr-tile-un { border-color: var(--danger); }
.dash-mr-tile .k { display: block; font-size: 13px; color: var(--muted); }
.dash-mr-tile-un .k { color: var(--danger); }
.dash-mr-tile .v { display: block; margin-top: 4px; font-weight: 700; line-height: 1.5;
  font-family: var(--font-heading); }
.dash-mr-sec { margin-top: 24px; }
.dash-mr-sec h3 { font-family: var(--font-heading); font-size: 1rem; font-weight: 700;
  color: var(--text); margin: 0; }

/* 미점검 — 밀린 일. **한 행 = 계획 하나**(사용자 지시 2026-08-19): 왼쪽 내용, 오른쪽 조치 둘.
   색은 승인 팔레트 토큰만 쓴다(원값 금지). */
/* M1(V8) — 이 색 규칙은 예전에 여기 있었으나 소스 순서상 뒤의 .dash-block h2 { color:
   var(--text) } 에 밀려 **적용되지 않고 있었다**(같은 특이도, 나중 규칙이 이긴다 — 실측
   15,39,36=--text). .dash-block h2 뒤(아래 .dash-overdue h2, .dash-integrity h2 규칙)로
   옮겼다 — 정합성(.dash-integrity h2)은 이미 그 자리에 있어 실측에서 살아 있었다. */
/* V6-5 — 「미점검 N」의 N 은 요약 칩(20.8px)과 같은 값의 사본이다. 칩이 정본이므로 여기
   숫자만 무게를 낮춘다(제목 글자 크기는 그대로 두고 숫자는 굵기만 일반으로).
   F3(실측) — 굵기와 함께 color:muted 까지 내려 h2(danger) 안 숫자만 muted(회색)로 보였다.
   같은 화면 요약 칩의 '미점검' 숫자는 danger 다 — 같은 지표가 색이 갈렸다. color 선언을
   없애 부모(.dash-overdue h2, danger)를 상속시키고 시각 무게는 굵기로만 낮춘다. */
.dash-overdue h2 .dash-h2-n { font-weight: 400; }
/* P1-3(재평가 0920) — 설명문(2~3줄)이 처리 대상(항목 카드)보다 시각 면적을 더 먹었다
   (390px 실측 601px, 내용은 2건뿐). 삭제가 아니라 기본 닫힘 <details> 로 — '미점검'·
   '재등록됨'이 뭔지 모르는 사용자를 위해 펼치면 전부 읽힌다. summary 는 44px 이상. */
.dash-od-note { margin: 8px 0 0; }
.dash-od-note summary { min-height: 44px; display: flex; align-items: center;
  color: var(--muted); font-size: 13px; cursor: pointer; }
.dash-od-note summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dash-od-note[open] summary { margin-bottom: 2px; }
.dash-od-note .dash-modal-meta { margin: 0 0 0 2px; }
.dash-od-row { display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  margin-top: 8px; background: var(--surface); }
/* V3 — 상태색을 면(배경)으로도 확장한다(지금까지는 테두리·글자뿐이었다). 5%/10% 는
   대비 재검증을 마친 값이다(보고서의 계산값 참조) — 임의로 더 진하게 올리지 않는다.
   V6 — 왼쪽 4px 보더를 없앤다: 배경 tint + 우측 배지만으로 같은 사실을 이미 두 번 말한다
   (보더까지 있으면 네 번, 여기에 danger 버튼·아이콘까지 겹쳐 여섯 겹이었다 — 실측). */
.dash-od-stale { background: color-mix(in srgb, var(--danger) 5%, var(--surface)); }
/* min-width:0 이 없으면 flex 자식이 내용 폭 아래로 안 줄어 버튼이 화면 밖으로 밀린다. */
.dash-od-text { flex: 1 1 auto; min-width: 0; }
/* 공사명은 **자르지 않는다** — 이 목록의 주소는 끝자리만 다르다(dashboard.js overdueRow_ 주석). */
.dash-od-name { margin: 0; font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
.dash-od-meta { margin: 3px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* 경과일 배지 — 숫자를 앞세워 조치 순서를 정하게 한다. 테두리를 함께 둬서 색을 못 보는
   사람에게도 '오래 밀림'이 전달되게 한다(WCAG 1.4.1 색만으로 의미 전달 금지). */
.dash-od-days {
  flex: none;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--text);
  background: var(--surface);
}
.dash-od-days-stale { border-color: var(--danger); color: var(--danger);
  background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }
.dash-od-stale .dash-od-meta { color: var(--danger); }
/* 「재등록됨」 — 경보가 아니라 **이미 손을 쓴 상태**다. 밀린 건과 같은 자리에 있지만 색
   계열을 갈라 한눈에 나뉘게 한다. 색만으로 말하지 않는다(WCAG 1.4.1) — 배지 글자가
   '재등록됨' 이라 색을 못 보는 사람에게도 같은 정보가 간다.
   V6 — --accent(브랜드 그린)는 헤더·조회 버튼과 같은 색이라 '재등록됨'(작성 대기)을
   완료·성공으로 오독시켰다(실측: 배지 글자색이 --accent 와 완전히 같았다). --warn 으로
   갈라 브랜드 색과 완전히 분리한다. 왼쪽 보더도 stale 과 같은 이유로 없앤다. */
.dash-od-days-reopened { border-color: var(--warn); color: var(--warn);
  background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
/* M2(V8) — stale(danger 5%)과 같은 5% 였을 때 라이트·다크 모두 최대 채널차가 2뿐이라
   두 상태의 행 배경이 사실상 구분되지 않았다(WCAG 1.4.1 위반은 아니다 — 배지 글자가
   남아 있다). warn 을 10%로 올려 비대칭을 준다(계산 확인: 라이트 최대채널차 ≈14~17,
   다크 ≈10 — 둘 다 목표 8 이상). */
.dash-od-reopened { background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
/* 한 카드 안의 두 번째 묶음 — 위 목록과 붙어 보이지 않게 경계를 준다. */
.dash-od-subhead { margin: 22px 0 6px; padding-top: 14px; border-top: 1px solid var(--border);
  font-size: 16px; font-weight: 700; color: var(--text);
  font-family: var(--font-heading);
  display: flex; align-items: center; gap: 8px; }
/* V7-R2 — 형제 섹션(미점검 h2)의 아이콘과 같은 규칙: 그 상태의 글자색을 그대로 물려받는다.
   재등록됨 배지·보더가 --warn 이므로 아이콘도 --warn 으로 맞춘다(새 색 발명 금지). */
.dash-od-subhead .dash-icon { color: var(--warn); }
/* 조치는 **가로로** 나란히 둔다(사용자 지시 2026-08-19) — 세로로 쌓으면 행 하나가 세 배로
   높아져 "한 줄로 만들라"던 목적이 사라진다. 폭이 모자라면 아래 미디어쿼리가 행 자체를
   접는다(내용 위 / 조치 아래). */
.dash-od-acts { display: flex; flex-direction: row; gap: 6px; flex: 0 0 auto; }
/* 높이 44px 는 터치 타깃 하한이라 더 줄이지 않는다. 글자는 줄바꿈하지 않는다. */
.dash-od-btn { min-height: 44px; padding: 0 12px; font-size: 0.88rem; white-space: nowrap; }
/* V6-4 — 재등록(가장 흔하고 되돌릴 수 있는 조치)만 solid 로 채워 위계를 준다. 새 색을
   만들지 않고 기존 .dash-btn-primary(조회·열기 등이 쓰는 solid 계열)를 그대로 재사용한다 —
   overdueRow_ 에서 클래스만 얹는다. */
/* 되돌릴 수 없는 조치는 테두리·글자로 구분한다 — 채우지 않는다(빨간 면이 두 줄 걸러 나오면
   목록 전체가 경보로 보여 정작 오래 밀린 건이 안 띈다). */
/* B3(V8) — hover/active 배경을 transparent 혼합에서 **--surface 기준 혼합**(불투명)으로
   바꾼다. transparent 혼합은 반투명이라 이 버튼 밑에 깔린 것(주로 .dash-od-stale 의 danger
   5% 행 tint)위에 다시 얹혀 이중 적용됐다 — 실측 active 대비가 라이트 4.32:1(기준 4.5
   미달)까지 떨어진 원인. --surface 기준 혼합은 완전 불투명이라 밑에 무엇이 있어도 결과
   색이 고정된다(계산 확인: 라이트 active 14% ≈ 4.97:1, dark 14% ≈ 5.72:1 — 여유 확보). */
.dash-od-danger { border-color: var(--danger); color: var(--danger); }
.dash-od-danger:hover { background: color-mix(in srgb, var(--danger) 10%, var(--surface));
  border-color: var(--danger); }
.dash-od-danger:active { background: color-mix(in srgb, var(--danger) 14%, var(--surface)); }
/* 공사취소 — 되돌릴 수 없지만 **경보는 아니다**(우리가 놓친 것이 아니라 상황이 없어진 것).
   빨강을 두 개 두면 목록 전체가 경보로 보여 정작 미점검확정이 안 띈다.
   danger 버튼과 같은 이중 적용 구조라 같이 --surface 기준으로 바꾼다(비율은 그대로 —
   이미 통과였고 계산상 오히려 여유가 늘었다). */
.dash-od-mute { border-color: var(--muted); color: var(--muted); }
.dash-od-mute:hover { background: color-mix(in srgb, var(--muted) 10%, var(--surface));
  border-color: var(--muted); }
.dash-od-mute:active { background: color-mix(in srgb, var(--muted) 18%, var(--surface)); }
/* 날짜 칸 아래 안내 — 칸과 붙여 읽히도록 위 여백을 좁힌다 */
.dash-od-hint { margin: -6px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.dash-od-warn-mute { border-color: var(--muted);
  background: color-mix(in srgb, var(--muted) 8%, transparent); }
.dash-od-warn { margin: 12px 0 0; padding: 12px; border-radius: 8px; font-size: 0.9rem;
  line-height: 1.6; color: var(--text);
  border: 1px solid var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, transparent); }
/* 자정 예고처럼 **있을 때만** 쓰는 문단 — 문구가 비면 테두리만 남은 빈 상자가 된다 */
.dash-od-warn:empty { display: none; }
/* 여러 건을 한 번에 (2026-08-28) — 행 왼쪽 끝의 선택칸과, 제목 아래 나타나는 일괄 막대.
   색은 위와 같은 승인 팔레트 토큰만 쓴다(원값 금지). */
.dash-od-pick { display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; flex: none; min-width: 44px; min-height: 44px; cursor: pointer;
  border-radius: 8px; transition: background 180ms ease; }
.dash-od-pick[hidden] { display: none; }
.dash-od-pick:hover { background: var(--row-hover); }
.dash-od-pick input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent); }
.dash-od-pick input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 「전체 선택」은 글자를 달고 왼쪽으로 붙인다 — 아래 행들의 선택칸과 같은 세로선에 놓기 위해서다 */
.dash-od-pickall { justify-content: flex-start; padding: 0 8px; margin-top: 8px;
  font-size: 13px; color: var(--muted); }
.dash-od-picktext { line-height: 1.5; }
/* F5(사용자 실기기 지시 2026-09-17) — 세로 3단(선택/내용/조치) 대신 row+wrap 으로
   [선택][내용] 을 한 줄에, [조치] 를 다음 줄에 둔다. .dash-od-row 자식 3개 구조는 그대로
   유지(D40 이 children.length===3 강제) — flex-wrap 이 셋째 자식만 다음 줄로 내릴 뿐 DOM은
   안 바뀐다. 실측(허브 3안 비교): 행 높이 390px 191→170 · 360px 218→190 · 320px 218→190.
   **이 블록은 .dash-od-pick·.dash-od-pickall 의 무조건 규칙보다 소스상 아래에 둔다** —
   media 조건은 특이도를 높이지 않으므로, 위(246번대)에 두면 justify-content:center 가
   같은 특이도·나중 소스 순서로 이겨 flex-start 가 조용히 무효화된다(실측으로 발견:
   input.left 가 56.5 로, box.left+center 오프셋(44+12)과 정확히 일치했다 — M1 의 같은

     공사명·조치 좌측선(44)에서 13px 밀렸다(실측 L57). flex-start 로 같은 선에 맞춘다. */
  .dash-od-pick { align-self: flex-start; justify-content: flex-start; flex: none; }
  /* 전체 선택 칸은 .dash-od-row 밖(섹션 직속)이라 같은 8px 패딩으로는 행의 pick(패딩 없음
     + 행 자체 패딩 10px) 과 좌측선이 2px 어긋난다(실측 input.left 45 vs 48). 10px 로
     맞춰 나머지 오차(반올림 포함) 이내로 좁힌다. */
  .dash-od-pickall { padding-left: 10px; }
  .dash-od-text { flex: 1 1 0; min-width: 0; }
  /* 조치 줄을 선택칸 폭(44px)만큼 들여 공사명과 같은 좌측선에 맞춘다(실측 88==88). */
  .dash-od-acts { flex: 1 1 100%; margin-top: 8px; margin-left: 44px; }
  /* 셋이 폭을 고르게 나눠 갖는다 — 좁아도 글자가 잘리지 않게 좌우 여백만 줄인다 */
  .dash-od-acts .dash-btn { flex: 1 1 0; min-width: 0; padding: 0 4px; font-size: 0.84rem; }
}
/* F5 예외(실측 확인) — 320px 에서는 margin-left:44px 를 유지하면 버튼 폭이 56px 로 줄어
   '미점검확정' 라벨이 잘린다(54<62). 이 폭에서만 들여쓰기를 되돌려 버튼이 44선 기준
   전폭(68px)을 쓰게 한다 — 공사명(88)과 버튼(44)의 좌측선이 어긋나지만, 라벨 잘림이
   정렬 어긋남보다 더 큰 결함이라 이쪽을 택한다. */
@media (max-width: 340px) {
  .dash-od-acts { margin-left: 0; }
}
/* 일괄 막대 — 아무것도 안 골랐으면 **없는 셈**이어야 한다. display 를 선언했으므로
   [hidden] 동반 가드를 같이 둔다(styles.css 규약: 전역 !important 를 떼도 안 터지게).
   **화면 아래에 띄운다**: 흐름 안에 두고 숨겼다 풀면, 첫 건을 고르는 순간 막대 높이만큼
   (375px 기준 66px) 아래 목록이 통째로 내려간다 — 두 번째 칸을 누르려던 손가락이 그 자리로
   올라온 «재등록» 버튼을 눌러 엉뚱한 단건 모달이 열렸다(2026-08-28 실브라우저 디버깅 S13).
   떠 있으면 아무것도 밀지 않고, 쉰 건짜리 목록 아래쪽에서 골라도 버튼이 손에 닿는다.
   z-index 는 모달(100)보다 **낮게** — 모달이 열리면 막대는 그 뒤로 가려야 한다. */
.dash-od-bulkbar { position: fixed; z-index: 90;
  left: 50%; transform: translateX(-50%);
  bottom: 12px; bottom: max(12px, env(safe-area-inset-bottom));
  width: min(1060px, calc(100% - 24px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin: 0; padding: 10px 12px; border: 1px solid var(--accent);
  border-radius: 10px; background: var(--row-selected);
  box-shadow: 0 6px 24px color-mix(in srgb, var(--text) 22%, transparent); }
.dash-od-bulkbar[hidden] { display: none; }
.dash-od-bulkcount { font-weight: 700; color: var(--text);
  font-variant-numeric: tabular-nums; }
.dash-od-bulkacts { margin-left: auto; flex-wrap: wrap; }
.dash-od-bulkbar .dash-od-err { flex: 1 1 100%; margin: 0; }
/* 모달 안의 대상 목록·실패 목록 — 열두 건이 화면을 넘기지 않게 스크롤을 준다
   (무엇이 바뀌는지는 **봐야** 하므로 접지는 않는다). */
.dash-od-bulklist, .dash-od-faillist { margin: 12px 0 0; padding-left: 20px;
  max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6;
  color: var(--muted); }
.dash-od-faillist { color: var(--danger); }
/* 진행 표시 — 30~50초 걸리므로 어디까지 갔는지 늘 보인다 */
.dash-od-prog { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5;
  font-variant-numeric: tabular-nums; }
.dash-od-prog:empty { display: none; }
@media (prefers-reduced-motion: reduce) { .dash-od-pick { transition: none; } }
.dash-od-form { display: grid; gap: 16px; margin: 16px 0; }
.dash-od-field { display: grid; gap: 6px; }
.dash-od-field label { font-size: 13px; color: var(--muted); }
.dash-od-field select, .dash-od-field input { min-height: 44px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  color: var(--text); font: inherit; transition: border-color 180ms ease; }
.dash-od-field select:hover, .dash-od-field input:hover { border-color: var(--muted); }
.dash-od-field select:focus-visible, .dash-od-field input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.dash-od-err:empty { display: none; }
.dash-od-go { width: 100%; }
@media (prefers-reduced-motion: reduce) { .dash-od-field select, .dash-od-field input { transition: none; } }
.dash-btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dash-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.dash-btn-primary:active { background: var(--accent-active); border-color: var(--accent-active); }
.dash-btn:disabled { opacity: 0.5; cursor: default; }
/* P1-1(B, 재평가 0920) — 실측 1440px: 필터 카드 우측 628px(49%) 공백, 정렬선이 아래 전폭
   블록과 끊겨 「로딩 실패처럼 보인다」던 W1~W5 반폭 사고와 같은 유형이었다. 3안(A: KPI 카드
   줄을 끌어올려 한 줄 / B: max-width 로 좁힘 / C: 우측에 캡션·기준시각 이동) 중 B 채택 —
   내용 실측폭 652px 보다 넉넉한 760px 로, 필드 줄바꿈 없이 의도된 좌측 정렬 카드가 된다.
   A 는 renderKpiCards_ host(#dash-summary)를 이 카드와 같은 부모로 재배선해야 하는데
   D57~D61 이 검사하는 renderStatTiles_ DOM 계약·호출 순서를 건드릴 위험이 있어 보류,
   C 는 헤더(#dash-generated, P0-2 대상)까지 같이 옮겨야 해 범위가 커진다 — 최저비용 B 로
   같은 목표(정렬선 복구)를 먼저 확보한다. */
.dash-controls { display: flex; gap: 16px; align-items: end; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 20px; margin: 0 0 24px; max-width: 760px; }
.dash-controls label { display: flex; flex-direction: column; gap: 6px;
  font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.dash-controls select, .dash-controls input { min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem;
  background: var(--surface); color: var(--text); cursor: pointer;
  transition: border-color 0.15s; }
.dash-controls select:hover, .dash-controls input:hover { border-color: var(--muted); }
.dash-controls select:focus-visible, .dash-controls input:focus-visible,
#dash-key-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dash-controls .note { color: var(--muted); font-size: 0.85rem; align-self: center; }
/* P1-2 — 요약 줄(접힌 상태)은 데스크톱에서 항상 숨긴다. 폭 조건은 아래 @media 에서만 켠다 —

.dash-controls-summary { display: none; }
@media (max-width: 560px) {
  .dash-controls-fold[data-collapsed] .dash-controls-summary {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; min-height: 44px; padding: 0 16px; margin: 0 0 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font: inherit; font-size: 0.9rem; text-align: left; cursor: pointer; }
  .dash-controls-summary:hover { border-color: var(--muted); }
  .dash-controls-summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #dash-controls-summary-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .dash-controls-summary-cta { flex: none; color: var(--accent); font-weight: 600; }
  .dash-controls-fold[data-collapsed] #dash-controls { display: none; }
}
/* KPI 카드 줄(K1~K6, 2026-09-17) — 필터 아래·첫 데이터 블록 위. 데이터가 없으면
   만들지 않는다(JS). 맨몸 텍스트 칩과 아래 「이번 주」 타일에 같은 숫자(점검·부적합·
   협력회사)가 두 번 나오던 중복을 걷어내고, 이 카드 줄 하나로 합쳤다(사용자 지시).
   카드 자체는 .dash-tile 을 그대로 재사용한다(412행~) — 새 카드 스타일을 만들지 않는다.
   R1~R5(2026-09-17) — 줄이 두 묶음(조회 기간 · 이번 주)이 됐다. 캡션+그리드가 반복되므로
   두 번째 캡션(이번 주 캡션)에만 위 여백을 줘 묶음을 시각적으로 가른다. */
#dash-summary { margin: 0 0 20px; }
#dash-summary[hidden] { display: none; }
/* P2-A(스코프 축소, 재평가 0920) — 모든 블록이 전폭 1컬럼이라 리듬이 없다(vision 판독:
   "같은 라운드·같은 폭 카드 세로 반복"). KPI 카드 줄만 필터 카드(.dash-controls, P1-1)와
   같은 폭으로 좁혀 좌측 정렬 리듬을 준다. 「이번 주」 블록과 나란히 2열로 합치는 안(원 지시
   (A))은 #dash-summary·#dash-blocks 가 서로 다른 컨테이너(형제 아님, main 안쪽에 이번 주
   섹션이 중첩)라 display:contents 로 경계를 걷어내야 하는데, #dash-blocks 는 odBarSpace_·
   scrollBlockTop_ 등 자체 rect 를 재는 JS 가 물려 있어 위험이 크다 — 이번 라운드는 보류하고
   낮은 위험의 폭 차등만 적용한다(표 블록은 W1~W5 전폭 결정 그대로, 손대지 않는다). */
@media (min-width: 1181px) {
  #dash-summary { max-width: 760px; }
}
.dash-kpis-caption { font-size: 0.78rem; font-weight: 600; color: var(--muted);
  letter-spacing: 0.02em; margin: 0 0 8px; }
.dash-kpis-caption ~ .dash-kpis-caption { margin-top: 18px; }
#dash-key-screen { max-width: 400px; margin: 64px auto; display: flex; flex-direction: column;
  gap: 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px 28px; }
#dash-key-screen label { font-size: 1.05rem; font-weight: 700; color: var(--text); }
#dash-key-input { min-height: 44px; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 10px; font-size: 1rem; }
.dash-banner { padding: 12px 16px; border-radius: 10px; margin: 0 0 16px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 0.92rem; }
.dash-banner-error { border-color: var(--danger); border-left-width: 4px;
  color: var(--danger); }
/* 타일 수는 데이터에 달렸다(보통 3개) — 4열 고정은 남는 칸을 만든다(D4).
   auto-fit + minmax 로 있는 만큼만 채우고, 모자라면 남는 폭을 나눠 갖는다.
   최소폭 170px — 「이번 주」가 D2 로 반폭(1440px 기준 약 590px 안쪽 내용폭)이 된 뒤에도
   3열이 나오게 하는 실측 하한이다(200px 로는 반폭에서 2열로 접혔다). */
.dash-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
/* 주간 스트립(사용자 선택 2026-08-10) — 2026-08-26 부터 **일별 건수 막대**를 담는다.
   그전에는 날짜만 있는 달력이었다: 차트처럼 생겼는데 아무것도 나타내지 않았다(서버가 일별
   데이터를 안 줬다). 고칠 곳이 그림이 아니라 데이터였다는 뜻이다.
   서버가 안 주면 `.has-bars` 가 안 붙어 옛 달력 그대로다 — 빈 차트를 그리지 않는다.
   오늘 칸 강조, 지난 칸 옅게. */
/* W5(2026-09-17) — 「이번 주」가 전폭이 되면서(W1) 옛 max-width:460px 가 카드 왼쪽에만
   붙어 우측이 크게 비었다(허브 실측). 별도 상한을 새로 정하는 대신 걷어낸다 — `.dash-shell`
   자체가 이미 max-width:1320px 로 페이지 전체를 막고 있어(위 33행) 이 블록도 다른 전폭
   블록과 똑같이 그 이상 커질 수 없다. 상한을 따로 두면 이 블록만 형제 블록보다 좁아
   보여 더 어색해진다(실측 비교 후 기각). repeat(7, 1fr) 가 이제 카드 실폭을 그대로
   나누므로 요일 칸이 균등하게 퍼진다 — 실측(1440px, 카드 내부폭 1240px): 우측 여백 0px
   (요구 ≤40px 충족), 막대(14px)는 각 칸 안에서 그대로 가운데 정렬돼 비어 보이지 않는다. */
.dash-weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  margin: 4px 0 14px; }
.dash-wday { display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 7px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); }
/* 막대. 트랙은 0건인 날에도 남는다 — 「점검이 없던 날」이 빈 칸으로 보여야 한다.
   끝만 4px 둥글고 바닥에 붙는다(막대 길이가 곧 값이라 바닥이 흔들리면 안 된다). */
.dash-weekstrip.has-bars .dash-wday { gap: 4px; padding: 8px 0 8px; }
.wbar-track { width: 14px; height: 40px; border-radius: 4px; display: flex; align-items: flex-end;
  background: color-mix(in srgb, var(--muted) 12%, transparent); }
.wbar { width: 100%; min-height: 3px; border-radius: 4px 4px 2px 2px; background: var(--accent); }
.wbar-n { font-size: 0.72rem; font-weight: 700; font-variant-numeric: tabular-nums;
  color: var(--text); min-height: 1em; line-height: 1; }
/* X3(2026-09-17) — n===0(실제 0건)과 n===null(자료 없음)을 muted 숫자('0'/'-')로 **보이게**
   바꿨다(예전엔 둘 다 visibility:hidden 이라 미래 날짜와 오늘 0건이 똑같이 빈 칸이었다 —
   0 을 지어낸 것과 같은 결과, B1). 굵기·색만 낮춰 그 날의 숫자(예: 목17)와 위계를 가른다. */
/* .dash-wday.today .wbar-n(아래, 3클래스 선택자)이 이 규칙과 특이도가 같아 소스 순서상
   이긴다 — 오늘 칸의 0/자료없음 숫자는 그 칸의 다른 숫자처럼 on-accent 를 그대로 쓴다
   (오늘 칸 안에서까지 희미하게 가르는 것은 과한 구분이다). muted 는 오늘이 아닌 칸에만 적용된다. */
.wbar-n-zero, .wbar-n-missing { font-weight: 500; color: var(--muted); }
/* X4(2026-09-17) — 오늘 칸(배경이 accent)의 트랙을 28%→12% 로 낮춰 더 어둡게 한다.
   채움(--on-accent, 불투명)과의 대비가 실측 3.15:1(WCAG UI 최소 3:1 턱걸이)에서
   4.25:1(라이트)·7.9:1(다크)로 오른다 — sRGB 합성 계산, 12% 는 기본 트랙(위 373행)과
   같은 값이라 새 토큰 없이 재사용한다. */
.dash-wday.today .wbar-track { background: color-mix(in srgb, var(--on-accent) 12%, transparent); }
.dash-wday.today .wbar { background: var(--on-accent); }
.dash-wday.today .wbar-n { color: var(--on-accent); }
/* A1-3(X-5.4.4) — 10.88px(0.68rem) 는 본문 하한(11px) 미달. 요일 글자는 장식 뱃지가
   아니라 데이터 라벨이라 소형 UI 예외 대상이 아니다 — 11px 로 올린다(축소가 아니라 상향
   이라 390px 7칸 줄바꿈 실측 후 채택, 넘김/줄바꿈 없음 확인). */
.dash-wday .dow { font-size: 11px; color: var(--muted); }
.dash-wday .num { font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.dash-wday.past { background: color-mix(in srgb, var(--accent) 8%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 22%, var(--border)); }
.dash-wday.today { background: var(--accent); border-color: var(--accent); }
.dash-wday.today .dow, .dash-wday.today .num { color: var(--on-accent); }
.dash-tile { background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px; }
.dash-tile { border-top: 3px solid var(--accent); }
/* 「지난주 대비」 줄이 있는 타일(점검)만 키가 커진다 — 같은 줄의 다른 타일과 높이를
   맞춘다(D4, 2열 모바일에서 짝 없는 마지막 줄은 grid stretch 로도 못 맞춰진다).
   V2 로 숫자가 30→40px+ 커진 만큼 바닥도 함께 올린다(안 올리면 sub 줄이 padding 을 뚫는다). */
.dash-tile { min-height: 116px; }
/* V2 — 라벨은 더 조용하게(크기·굵기를 낮춘다), 숫자가 주인공이 되게 자리를 내준다. */
.dash-tile .k { display: block; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.03em;
  color: var(--muted); margin-bottom: 6px; }
.dash-tile .v { display: block; font-size: 2.5rem; font-weight: 700; line-height: 1.1;
  color: var(--text); font-variant-numeric: tabular-nums; }
/* 「지난주 대비」 맥락 줄 — 숫자 아래 작은 보조 글. 증감은 글로도 말한다(색만 쓰지 않는다). */
.dash-tile .sub { display: block; font-size: 0.74rem; color: var(--muted); margin-top: 5px;
  line-height: 1.4; }
/* X5(2026-09-17) — 점검 건수는 많을수록 좋은 지표라 감소를 주의색(--warn), 증가를
   긍정색(--ok)으로 신호한다. 결합 선택자로 특이도를 올려 위 .dash-tile .sub 와의 소스
   순서 문제를 원천 차단(K4 와 같은 패턴). danger(부적합 전용)는 쓰지 않는다 — 절제한
   고급화가 기준이라 점검 감소를 부적합과 같은 무게로 보이면 과장이다. 화살표(▲▼)를
   sub.textContent 쪽에서 같이 붙인다 — 색만으로 의미를 나르지 않는다(접근성). */
.dash-tile .sub.sub-up { color: var(--ok); }
.dash-tile .sub.sub-down { color: var(--warn); }
/* K4 — 미점검·부적합이 0 보다 큰 카드는 border-top·배경 tint·라벨/숫자 색을 위험색으로.
   결합 선택자(.dash-tile.dash-tile-danger)로 특이도를 올려 위 .dash-tile 규칙과의 소스
   순서 문제를 원천 차단한다(이 파일 상단 CSS 함정 주석 참조). 배경은 surface 기준
   color-mix 로만 섞는다(행 tint 이중 적용 방지, V8 교훈) — 완료로 오독되는 초록(--ok)은
   쓰지 않는다(V6 교훈). */
.dash-tile.dash-tile-danger { border-top-color: var(--danger);
  background: color-mix(in srgb, var(--danger) 4%, var(--surface)); }
.dash-tile.dash-tile-danger .k, .dash-tile.dash-tile-danger .v { color: var(--danger); }
.dash-block { margin: 0 0 20px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; }
/* P0-3 — CSV 다운로드(실측 106×36) 도 44px 하한 미달이다. 개수가 적어(블록당 1개) 실제
   높이를 올려도 레이아웃 영향이 작다 — ::after 트릭 없이 그대로 키운다. */
.dash-block-head .dash-btn { color: var(--accent); border-color: var(--accent);
  min-height: 44px; padding: 0 14px; font-size: 0.85rem; }
.dash-block-head { display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
/* V1 — 옛 h2::before 네모 불릿을 인라인 SVG 아이콘으로 대체한다(renderBlock_/renderOverdue_).
   h2 를 flex 로 바꿔 아이콘·글자를 한 줄에 놓는다. */
.dash-block h2 { display: flex; align-items: center; gap: 8px;
  font-size: 1rem; font-weight: 700; color: var(--text); margin: 0; }
/* V4 — 3단 위계. 기본(3단·상세 집계표: 오늘 제출·협력회사별·공사별)은 아이콘을 조용하게(muted). */
.dash-block h2 .dash-icon { color: var(--muted); }
/* 2단(요약: 이번 주) — 본문보다 한 단 크게, 아이콘은 accent(그 블록의 강조색과 통일). */
.dash-block-week h2 { font-size: 1.0625rem; }
.dash-block-week h2 .dash-icon { color: var(--accent); }
/* X1(2026-09-17) — 사용자 지시("이번주 카드를 이미지 오른쪽에 배치")로 「이번 주」 블록
   안에서 요일 막대(왼쪽) + 점검·미점검 카드(오른쪽)를 2열로 둔다. 막대가 좁아지지
   않도록 막대쪽을 더 넓게(1.35fr : 1fr) — 허브 실측(1440px, 블록 내부폭 1240px, gap 20):
   막대 700px · 카드 열 518px(카드 253px×2). minmax(0, …)·minmax(240px, …) 하한을 명시하는
   이유는 그냥 1fr 만 쓰면 max-content 가 불균등 반영되는 함정이 있어서다(D2 교훈).
   align-items: stretch 로 좌우 바닥선을 맞춘다(실측 높이차 ≤4px 목표). 카드 없이 막대만
   있을 때(renderBlock_ 이 weekCards 를 못 받은 경우)는 이 클래스 자체가 안 붙어 막대가
   그대로 전폭이다(X2). */
.dash-week-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(240px, 1fr);
  gap: 20px; align-items: stretch; }
.dash-week-stripcol { display: flex; flex-direction: column; justify-content: center; }
.dash-week-stripcol .dash-weekstrip { margin: 4px 0 0; }
.dash-week-layout .dash-kpis { align-content: start; }
/* 1단(처리 필요: 미점검·확인이 필요한 기록) — 가장 크게.
   M1 정정(실측, V8) — 이전 주석은 "아이콘이 currentColor 로 danger 를 물려받는다"고
   적었으나 성립하지 않았다: 위 .dash-block h2 .dash-icon 이 svg 에 **명시** color(muted)를
   주므로 상속을 이긴다(실측 아이콘 색 64,97,91=muted). 아래 두 번째 규칙으로 명시 지정한다. */
.dash-overdue h2, .dash-integrity h2 { font-size: 1.125rem; color: var(--danger); }
.dash-overdue h2 .dash-icon, .dash-integrity h2 .dash-icon { color: inherit; }
.dash-block .note { color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; }
/* 표 헤더 고정(D3) — 행이 많은 표에서 스크롤 중에도 열 이름이 남는다.
   B2(V8) 구조 변경 — 예전엔 .dash-tablewrap 자신이 스크롤 컨테이너였다. 절대배치
   (.dash-scrollhint)의 기준은 **스크롤 컨테이너의 padding box** 라 그 박스가 스크롤과
   함께 움직여, 힌트가 스크롤을 따라 흘렀다(실측: scrollLeft 0/100/417 에서
   hint.left 317/217/-100 — 끝까지 밀면 힌트가 왼쪽 밖으로 나갔다).
   지금은 스크롤을 한 단 안쪽(.dash-tablescroll)으로 내리고, .dash-tablewrap 은 스크롤하지
   않는 정지 상자(테두리·라운드·힌트 기준점)로만 남는다 — 힌트가 이 상자 기준 절대배치라
   더는 흐르지 않는다. thead th 의 position:sticky 는 여전히 .dash-tablescroll 이 표의
   스크롤 조상이므로 살아 있다(부모에 overflow:hidden/clip 이 끼면 죽는다 — 이 저장소
   .category 전례. 여기선 .dash-tablewrap 이 overflow 를 안 갖는다). */
.dash-tablewrap { position: relative; border: 1px solid var(--border); border-radius: 10px; }
/* 안쪽 라운드를 바깥과 맞춰 표 모서리가 바깥 테두리를 넘어 삐져나오지 않게 한다
   (overflow:auto 인 요소도 자신의 border-radius 로 내용을 클리핑한다). */
.dash-tablescroll { overflow: auto; max-height: 560px; border-radius: 10px; }
.dash-block table { border-collapse: collapse; width: 100%; background: var(--surface); }
.dash-block th, .dash-block td { padding: 11px 16px; text-align: left; font-size: 0.9rem;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); color: var(--text); white-space: nowrap; }
/* V5 — 헤더 행에 살짝 더 숨을 준다(11px→13px). 본문 td 는 그대로 두어 표 밀도(행 리듬)를
   지킨다 — 헤더만 한 톤 낮춰 "머리"임을 여백으로도 드러낸다. */
.dash-block th { background: var(--bg); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.03em;
  color: var(--muted); position: sticky; top: 0; z-index: 2; padding-top: 13px; padding-bottom: 13px; }
/* 가로 스크롤 힌트(D6/B2) — 넘치는 표의 오른쪽 끝에 옅은 그라디언트. 기준점이
   .dash-tablewrap(스크롤하지 않는 정지 상자, 위 B2 주석)이라 스크롤과 함께 흐르지
   않는다. 장식 요소라 포커스·탭 흐름에서 뺀다(aria-hidden, JS).
   hidden 은 기본값 — dashboard.js updateScrollHints_ 가 렌더 뒤 실측해서 넘치는 표에만
   켠다(넘치지 않는 표에 힌트가 보이던 회귀, 실측: 표 4개 전부 보유 중 3개는 넘침 0). */
.dash-scrollhint { position: absolute; top: 0; right: 0; bottom: 0; width: 24px;
  pointer-events: none; background: linear-gradient(to left, var(--surface), transparent); }

<div class="dash-shell">
  <header class="dash-topbar">
    <h1>협력회사 SHE 현황</h1>
    <span id="dash-generated"></span>
    <span class="spacer"></span>
    <button type="button" class="dash-btn" id="btn-dash-theme">
      <span id="btn-dash-theme-label">어둡게</span>
    </button>
    <button type="button" class="dash-btn" id="btn-dash-refresh" hidden>
      <span>새로고침</span>
    </button>
    <button type="button" class="dash-btn" id="btn-dash-monthly" hidden>
      <span>월간 리포트</span>
    </button>
    <!-- 「키 지우기」는 되돌릴 수 없는 조치다. 일상 조치(새로고침·월간 리포트) 바로 옆에 같은
         무게로 두지 않는다 — NN/g 「Dangerous UX: Consequential Options Close to Benign
         Options」. 간격을 벌리고(피츠 법칙으로 일부러 멀게) 색·테두리로도 구분한다. -->
    <button type="button" class="dash-btn dash-btn-danger" id="btn-dash-clearkey" hidden>
      <span>키 지우기</span>
    </button>
  </header>

  <div id="dash-banner" aria-live="polite"></div>

  <section id="dash-key-screen" hidden>
    <label for="dash-key-input">대시보드 키</label>
    <input type="password" id="dash-key-input" autocomplete="off"
           placeholder="관리자에게 받은 키를 입력하세요">
    <button type="button" class="dash-btn dash-btn-primary" id="btn-dash-keysave">열기</button>
  </section>

  <!-- P1-2(재평가 0920) — 390~560px 모바일 첫 화면의 66~74%가 조작 UI(필터)였다. 필터는
       기본값(최근 30일)이 있고 조회 없이도 동작해 접기 적격이다(ff4e544 교훈: 계획이 정해
       주는 값만 접는다 — 사용자가 고르는 값을 접으면 안 된다. 여기서는 값 자체가 아니라
       "펼쳐 보기"만 접는다). 데스크톱(≥561px)은 CSS 가 항상 펼친 채로 강제(dashboard.js
       initControlsFold_/setControlsFolded_ 참조) — 폭과 무관하게 data-collapsed 를 켤 수는
       있지만 그 미디어 폭 밖에서는 무시된다. -->
  <div id="dash-controls-fold" class="dash-controls-fold">
    <button type="button" id="btn-dash-controls-toggle" class="dash-controls-summary" hidden>
      <span id="dash-controls-summary-text">조회 기간 최근 30일</span>
      <span class="dash-controls-summary-cta">기간·팀 변경</span>
    </button>
    <section id="dash-controls" class="dash-controls" hidden>
      <label>팀
        <select id="dash-team"></select>
      </label>
      <label>시작일
        <input type="date" id="dash-from">
      </label>
      <label>종료일
        <input type="date" id="dash-to">
      </label>
      <button type="button" class="dash-btn dash-btn-primary" id="btn-dash-query">조회</button>
      <span class="note">비우면 최근 30일</span>
      <!-- 협력회사별·공사별 제목의 괄호 기간(D5)을 화면에서 걷어낸 대신 여기 한 번만 적는다. -->
      <span class="note" id="dash-range-label"></span>
    </section>
  </div>

  <div id="dash-summary" hidden aria-live="polite"></div>

  <main id="dash-blocks"></main>
</div>

<div id="dash-modal" hidden>
  <div class="dash-modal-back" id="dash-modal-back"></div>
  <section class="dash-modal-card" role="dialog" aria-modal="true" aria-labelledby="dash-modal-title">
    <div class="dash-modal-head">
      <button type="button" class="dash-btn" id="btn-dash-modal-back" hidden>목록으로</button>
      <h2 id="dash-modal-title"></h2>
      <span class="spacer"></span>
      <button type="button" class="dash-btn" id="btn-dash-modal-close">닫기</button>
    </div>
    <div id="dash-modal-body"></div>
  </section>
</div>

<script src="./config.js?v=0.5.5-eba92f50"></script>
<script src="./dashboard.js?v=0.5.5-eba92f50"></script>
</body>
</html>
