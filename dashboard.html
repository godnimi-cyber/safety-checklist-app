<title>안전점검 대시보드</title>
<style>
/* 대시보드 전용 스타일 — 색은 styles.css :root 변수(승인 팔레트)만 쓴다(틴트는 흑백 알파만).
   앱 셸(.app-shell)과 무관한 독립 레이아웃. 내부 도구: 미관보다 상태 가시성 —
   장식 대신 위계(요약 타일 → 표), 카드 구획, 절제된 상태색으로 정돈한다. */
/* 토큰은 ./design-kit/tokens.css(킷 소비) — 이 파일에 색·수치 원값을 적지 않는다.
   계약 검사: web/design-kit/verify.mjs (raw 색·rgba·focus 제거 금지). */
.dash-shell { max-width: 1100px; margin: 0 auto; padding: 12px 20px 56px;
  font-family: var(--font-body); }
.dash-topbar h1, .dash-block h2, .dash-tile .v, .dash-modal-head h2 {
  font-family: var(--font-heading); }
/* 앱 styles.css 의 전역 main 패딩(하단 액션바 공간)이 #dash-blocks 에 끼어들어
   표들만 안쪽으로 밀린다 — 이 페이지에서는 무효화한다(폭 정렬의 전제). */
.dash-shell main { padding: 0; }
/* 음영은 제목 바 전용(사용자 지시) — 본문 카드는 보더로만 구획한다 */
/* sticky 고정 해제(사용자 지시 2026-08-10) — 모바일에서 헤더가 화면 위를 상시 점유했다 */
.dash-topbar {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  background: var(--accent);
  border-radius: 12px; padding: 16px 20px; margin-bottom: 16px;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--text) 18%, transparent); }
.dash-topbar h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em;
  color: var(--on-accent); margin: 0; }
#dash-generated { color: var(--on-accent); font-size: 0.82rem;
  background: color-mix(in srgb, var(--on-accent) 14%, transparent); padding: 4px 12px; border-radius: 999px; }
.dash-topbar .spacer { flex: 1; }
.dash-topbar .dash-btn { background: color-mix(in srgb, var(--on-accent) 12%, transparent);
  border-color: color-mix(in srgb, var(--on-accent) 70%, transparent); color: var(--on-accent); }
.dash-topbar .dash-btn:hover { background: color-mix(in srgb, var(--on-accent) 26%, transparent); border-color: var(--on-accent); }
.dash-topbar .dash-btn:focus-visible { outline-color: var(--on-accent); }
.dash-btn { min-height: 44px; padding: 0 18px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--surface); color: var(--text);
  cursor: pointer; font-size: 0.95rem; font-weight: 600;
  transition: background 0.15s, border-color 0.15s; }
.dash-btn:hover { background: var(--bg); border-color: var(--muted); }
.dash-btn:active { background: var(--row-hover); }
.dash-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 월간 리포트 — 수행과 미점검확정을 **표 두 개**로 가른다(사용자 지시 2026-08-19).
   합쳐서 '상태' 열을 두면 점검 2건 + 확정 1건인 공사의 상태를 한 값으로 못 적는다. */
.dash-mr-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.dash-mr-bar label { font-size: 13px; color: var(--muted); }
.dash-mr-bar input { min-height: 44px; padding: 0 12px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--surface); color: var(--text);
  font-family: var(--font-body); font-size: 0.95rem;
  transition: border-color 0.15s; }
.dash-mr-bar input:hover { border-color: var(--muted); }
.dash-mr-bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dash-mr-sum { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
/* 두 타일은 **나란히**다 — 위아래로 쌓으면 아래 것이 위 것의 부속처럼 읽힌다.
   미점검확정 타일만 색을 달리해 실적과 섞이지 않게 한다(합계 타일을 두지 않는 이유와 같다). */
.dash-mr-tile { flex: 1 1 220px; border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; background: var(--surface); }
.dash-mr-tile-un { border-color: var(--danger); }
.dash-mr-tile .k { display: block; font-size: 13px; color: var(--muted); }
.dash-mr-tile-un .k { color: var(--danger); }
.dash-mr-tile .v { display: block; margin-top: 4px; font-weight: 700; line-height: 1.5;
  font-family: var(--font-heading); }
.dash-mr-sec { margin-top: 24px; }
.dash-mr-sec h3 { font-family: var(--font-heading); font-size: 1rem; font-weight: 700;
  color: var(--text); margin: 0; }

/* 미점검 — 밀린 일. **한 행 = 계획 하나**(사용자 지시 2026-08-19): 왼쪽 내용, 오른쪽 조치 둘.
   색은 승인 팔레트 토큰만 쓴다(원값 금지). */
.dash-overdue h2 { color: var(--danger); }
.dash-od-row { display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  margin-top: 8px; background: var(--surface); }
.dash-od-stale { border-left: 4px solid var(--danger); }
/* min-width:0 이 없으면 flex 자식이 내용 폭 아래로 안 줄어 버튼이 화면 밖으로 밀린다. */
.dash-od-text { flex: 1 1 auto; min-width: 0; }
/* 공사명은 **자르지 않는다** — 이 목록의 주소는 끝자리만 다르다(dashboard.js overdueRow_ 주석). */
.dash-od-name { margin: 0; font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
.dash-od-meta { margin: 2px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.dash-od-stale .dash-od-meta { color: var(--danger); }
/* 조치는 **가로로** 나란히 둔다(사용자 지시 2026-08-19) — 세로로 쌓으면 행 하나가 세 배로
   높아져 "한 줄로 만들라"던 목적이 사라진다. 폭이 모자라면 아래 미디어쿼리가 행 자체를
   접는다(내용 위 / 조치 아래). */
.dash-od-acts { display: flex; flex-direction: row; gap: 6px; flex: 0 0 auto; }
/* 높이 44px 는 터치 타깃 하한이라 더 줄이지 않는다. 글자는 줄바꿈하지 않는다. */
.dash-od-btn { min-height: 44px; padding: 0 12px; font-size: 0.88rem; white-space: nowrap; }
/* 되돌릴 수 없는 조치는 테두리·글자로 구분한다 — 채우지 않는다(빨간 면이 두 줄 걸러 나오면
   목록 전체가 경보로 보여 정작 오래 밀린 건이 안 띈다). */
.dash-od-danger { border-color: var(--danger); color: var(--danger); }
.dash-od-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent);
  border-color: var(--danger); }
.dash-od-danger:active { background: color-mix(in srgb, var(--danger) 18%, transparent); }
/* 공사취소 — 되돌릴 수 없지만 **경보는 아니다**(우리가 놓친 것이 아니라 상황이 없어진 것).
   빨강을 두 개 두면 목록 전체가 경보로 보여 정작 미점검확정이 안 띈다. */
.dash-od-mute { border-color: var(--muted); color: var(--muted); }
.dash-od-mute:hover { background: color-mix(in srgb, var(--muted) 10%, transparent);
  border-color: var(--muted); }
.dash-od-mute:active { background: color-mix(in srgb, var(--muted) 18%, transparent); }
.dash-od-warn-mute { border-color: var(--muted);
  background: color-mix(in srgb, var(--muted) 8%, transparent); }
.dash-od-warn { margin: 12px 0 0; padding: 12px; border-radius: 8px; font-size: 0.9rem;
  line-height: 1.6; color: var(--text);
  border: 1px solid var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, transparent); }
/* 좁은 화면에서는 조치를 아래로 내린다 — 조치 셋이 가로로 230px 쯤 되어, 그만큼 떼고 나면
   공사명이 대여섯 줄이 된다. 그때는 내용 한 줄 / 조치 한 줄이 낫다. */
@media (max-width: 560px) {
  .dash-od-row { flex-direction: column; align-items: stretch; gap: 8px; }
  /* 셋이 폭을 고르게 나눠 갖는다 — 좁아도 글자가 잘리지 않게 좌우 여백만 줄인다 */
  .dash-od-acts .dash-btn { flex: 1 1 0; min-width: 0; padding: 0 4px; font-size: 0.84rem; }
}
.dash-od-form { display: grid; gap: 16px; margin: 16px 0; }
.dash-od-field { display: grid; gap: 6px; }
.dash-od-field label { font-size: 13px; color: var(--muted); }
.dash-od-field select, .dash-od-field input { min-height: 44px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  color: var(--text); font: inherit; transition: border-color 180ms ease; }
.dash-od-field select:hover, .dash-od-field input:hover { border-color: var(--muted); }
.dash-od-field select:focus-visible, .dash-od-field input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.dash-od-err:empty { display: none; }
.dash-od-go { width: 100%; }
@media (prefers-reduced-motion: reduce) { .dash-od-field select, .dash-od-field input { transition: none; } }
.dash-btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dash-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.dash-btn-primary:active { background: var(--accent-active); border-color: var(--accent-active); }
.dash-btn:disabled { opacity: 0.5; cursor: default; }
.dash-controls { display: flex; gap: 16px; align-items: end; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 20px; margin: 0 0 24px; }
.dash-controls label { display: flex; flex-direction: column; gap: 6px;
  font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.dash-controls select, .dash-controls input { min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem;
  background: var(--surface); color: var(--text); cursor: pointer;
  transition: border-color 0.15s; }
.dash-controls select:hover, .dash-controls input:hover { border-color: var(--muted); }
.dash-controls select:focus-visible, .dash-controls input:focus-visible,
#dash-key-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dash-controls .note { color: var(--muted); font-size: 0.85rem; align-self: center; }
#dash-key-screen { max-width: 400px; margin: 64px auto; display: flex; flex-direction: column;
  gap: 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px 28px; }
#dash-key-screen label { font-size: 1.05rem; font-weight: 700; color: var(--text); }
#dash-key-input { min-height: 44px; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 10px; font-size: 1rem; }
.dash-banner { padding: 12px 16px; border-radius: 10px; margin: 0 0 16px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 0.92rem; }
.dash-banner-error { border-color: var(--danger); border-left-width: 4px;
  color: var(--danger); }
.dash-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
/* 주간 스트립(사용자 선택 2026-08-10) — 일별 건수가 아니라 달력 그래픽이다(서버가 일별
   데이터를 주지 않는다 — 지어내지 않는다). 오늘 칸 강조, 지난 칸 옅게. */
.dash-weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  max-width: 460px; margin: 4px 0 14px; }
.dash-wday { display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 7px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); }
.dash-wday .dow { font-size: 0.68rem; color: var(--muted); }
.dash-wday .num { font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.dash-wday.past { background: color-mix(in srgb, var(--accent) 8%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 22%, var(--border)); }
.dash-wday.today { background: var(--accent); border-color: var(--accent); }
.dash-wday.today .dow, .dash-wday.today .num { color: var(--on-accent); }
.dash-tile { background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px; }
.dash-tile { border-top: 3px solid var(--accent); }
.dash-tile .k { display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em;
  color: var(--muted); margin-bottom: 6px; }
.dash-tile .v { display: block; font-size: 1.9rem; font-weight: 700; line-height: 1.1;
  color: var(--text); font-variant-numeric: tabular-nums; }
.dash-block { margin: 0 0 20px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; }
.dash-block-head .dash-btn { color: var(--accent); border-color: var(--accent);
  min-height: 36px; padding: 0 14px; font-size: 0.85rem; }
.dash-block-head { display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
.dash-block h2 { font-size: 1rem; font-weight: 700; color: var(--text); margin: 0; }
.dash-block h2::before { content: ''; display: inline-block; width: 8px; height: 8px;
  background: var(--accent); border-radius: 2px; margin-right: 8px; }
.dash-integrity h2::before { background: var(--danger); }
.dash-block .note { color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; }
.dash-tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
.dash-block table { border-collapse: collapse; width: 100%; background: var(--surface); }
.dash-block th, .dash-block td { padding: 11px 16px; text-align: left; font-size: 0.9rem;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); color: var(--text); white-space: nowrap; }
.dash-block th { background: var(--bg); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.03em;
  color: var(--muted); }
.dash-block tbody tr { transition: background 0.15s; }
.dash-block tbody tr:hover { background: var(--row-hover); }
.dash-block tr:last-child td { border-bottom: 0; }
.dash-num { text-align: right; font-variant-numeric: tabular-nums; }
.dash-danger { color: var(--danger); font-weight: 700; }
.dash-integrity { border-left: 4px solid var(--danger); }
.dash-integrity h2 { color: var(--danger); }
.dash-linknum { background: none; border: 0; padding: 4px 8px; margin: -4px -8px;
  font: inherit; font-weight: 700; color: var(--accent); text-decoration: underline;
  cursor: pointer; border-radius: 6px; }
.dash-linknum.dash-danger { color: var(--danger); }
.dash-linknum:hover { background: var(--bg); }
.dash-linknum:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#dash-modal { position: fixed; inset: 0; z-index: 100; display: flex;
  align-items: flex-start; justify-content: center; padding: 40px 16px; }
#dash-modal[hidden] { display: none; }
.dash-modal-back { position: absolute; inset: 0; background: color-mix(in srgb, var(--text) 45%, transparent); cursor: pointer; }
.dash-modal-card { position: relative; background: var(--surface); border-radius: 16px;
  overscroll-behavior: contain;
  width: 100%; max-width: 880px; max-height: 85vh; overflow: auto;
  padding: 20px 24px 24px; box-shadow: 0 12px 40px color-mix(in srgb, var(--text) 25%, transparent); }
.dash-modal-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.dash-modal-head h2 { font-size: 1.05rem; font-weight: 700; color: var(--text); margin: 0; }
.dash-modal-head .spacer { flex: 1; }
.dash-modal-meta { color: var(--muted); font-size: 0.88rem; margin: 0 0 12px; }
.dash-modal-tables { border: 0; padding: 0; margin: 0; }
/* 점검표: 자동 레이아웃은 내용만큼 넓어져 가로 스크롤을 만든다 — 고정 레이아웃으로
   항목이 남는 폭 전부를 받아 줄바꿈, 판정은 좁게 가운데, 사유는 고정 비율. */
.dash-sheet table { table-layout: fixed; }
.dash-sheet th, .dash-sheet td { white-space: normal; overflow-wrap: break-word; }
.dash-sheet th:nth-child(2), .dash-sheet td:nth-child(2) { width: 64px; text-align: center; }
.dash-sheet-note { background: var(--bg); border-radius: 8px; padding: 6px 10px;
  margin: 6px 0 0; color: var(--danger); font-size: 0.88rem; line-height: 1.5; }
/* nowrap(.dash-block td)보다 구체도가 높아야 줄바꿈이 실제로 걸린다 — 긴 항목 문구가
   한 줄로 화면 밖까지 밀리던 원인. */
.dash-block td.dash-wraptext { white-space: normal; min-width: 220px; }
.dash-sheet-section { background: var(--bg); font-weight: 700; }
.dash-findcard { border: 1px solid var(--border); border-left: 4px solid var(--danger);
  border-radius: 10px; padding: 12px 16px; margin: 0 0 10px; background: var(--surface); }
.dash-findcard .meta { color: var(--muted); font-size: 0.85rem; margin: 0 0 6px; }
.dash-findcard .item { color: var(--text); font-size: 0.95rem; line-height: 1.5; margin: 0; }
.dash-findcard .note { background: var(--bg); border-radius: 8px; padding: 8px 12px;
  margin: 8px 0 0; font-size: 0.92rem; line-height: 1.5; color: var(--danger); }
.dash-rowlink { cursor: pointer; }
.dash-rowlink:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* 공사별 카드 — 좁은 화면에서 5열 표 대신 보인다(같은 데이터·같은 드릴다운 버튼) */
.dash-proj-cards { display: none; }
.dash-projcard { border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; margin: 0 0 10px; background: var(--surface); }
.dash-projcard .comp { color: var(--muted); font-size: 0.8rem; margin: 0 0 2px; }
.dash-projcard .proj { color: var(--text); font-weight: 600; font-size: 0.95rem;
  line-height: 1.4; margin: 0 0 8px; }
.dash-projcard .nums { margin: 0; font-size: 0.92rem; color: var(--text); }
.dash-projcard .lbl { color: var(--muted); }
@media (max-width: 640px) {
  .dash-tiles { grid-template-columns: repeat(2, 1fr); }
  .dash-shell { padding: 8px 12px 40px; }
  /* 헤더 2행: 1행 = 제목 단독(크게) / 2행 = 기준 시각(좌) + 새로고침·키 지우기(우, 작게) */
  .dash-topbar { padding: 12px 16px; gap: 6px 8px; align-items: center; }
  .dash-topbar h1 { flex: 1 1 100%; font-size: 1.25rem; }
  /* 어둡게 버튼 추가로 3버튼 — 기준 pill 을 전폭 행으로 빼면 버튼들이 한 줄에 모인다 */
  #dash-generated { flex: 1 1 100%; font-size: 0.78rem; text-align: left; }
  .dash-topbar .dash-btn { min-height: 36px; padding: 0 10px; font-size: 0.8rem; }
  /* 컨트롤: 팀 전폭 → 시작일·종료일 나란히 → 조회 전폭 → 안내 */
  .dash-controls { display: grid; grid-template-columns: 1fr 1fr; padding: 14px 16px; gap: 12px; }
  .dash-controls label:first-child { grid-column: 1 / -1; }
  #btn-dash-query { grid-column: 1 / -1; }
  .dash-controls .note { grid-column: 1 / -1; margin: -4px 0 0; }
  /* 공사별: 표 숨기고 카드로 */
  .dash-block-has-cards .dash-tablewrap { display: none; }
  .dash-proj-cards { display: block; }
  /* 모달: 화면을 넓게 쓰고, 머리는 버튼 행(목록으로·닫기) 위 + 제목 아래 전폭 */
  #dash-modal { padding: 12px 8px; }
  .dash-modal-card { padding: 16px; max-height: 90vh; }
  #btn-dash-modal-back { order: 1; }
  .dash-modal-head .spacer { order: 2; }
  #btn-dash-modal-close { order: 3; margin-left: auto; }
  .dash-modal-head h2 { order: 4; flex: 1 1 100%; font-size: 1rem; }
  .dash-block td.dash-wraptext { min-width: 0; }
  .dash-sheet th, .dash-sheet td { padding: 10px 10px; font-size: 0.88rem; }
  .dash-sheet th:nth-child(2), .dash-sheet td:nth-child(2) { width: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .dash-btn, .dash-controls select, .dash-controls input, .dash-block tbody tr { transition: none; }
}
</style>
</head>
