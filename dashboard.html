<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E40AF">
<meta name="description" content="안전점검 대시보드 — 관리자 전용 현황·협력회사 성적">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css?v=0.5.5">
<title>안전점검 대시보드</title>
<style>
/* 대시보드 전용 스타일 — 색은 styles.css :root 변수(승인 팔레트)만 쓴다(틴트는 흑백 알파만).
   앱 셸(.app-shell)과 무관한 독립 레이아웃. 내부 도구: 미관보다 상태 가시성 —
   장식 대신 위계(요약 타일 → 표), 카드 구획, 절제된 상태색으로 정돈한다. */
.dash-shell { max-width: 1100px; margin: 0 auto; padding: 12px 20px 56px; }
/* 앱 styles.css 의 전역 main 패딩(하단 액션바 공간)이 #dash-blocks 에 끼어들어
   표들만 안쪽으로 밀린다 — 이 페이지에서는 무효화한다(폭 정렬의 전제). */
.dash-shell main { padding: 0; }
.dash-topbar { position: sticky; top: 0; z-index: 10;
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  background: var(--color-surface); border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 12px; padding: 14px 20px; margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
.dash-topbar h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em;
  color: var(--color-text); margin: 0; }
#dash-generated { color: var(--color-neutral-text, #576478); font-size: 0.85rem; }
.dash-topbar .spacer { flex: 1; }
.dash-btn { min-height: 44px; padding: 0 18px; border: 1px solid rgba(0, 0, 0, 0.15);
  border-radius: 10px; background: var(--color-surface); color: var(--color-text);
  cursor: pointer; font-size: 0.95rem; font-weight: 600;
  transition: background 0.15s, border-color 0.15s; }
.dash-btn:hover { background: var(--color-bg); border-color: rgba(0, 0, 0, 0.3); }
.dash-btn:active { background: rgba(0, 0, 0, 0.06); }
.dash-btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.dash-btn-primary { background: var(--color-primary); border-color: var(--color-primary); color: #FFFFFF; }
.dash-btn-primary:hover { background: var(--color-cta); border-color: var(--color-cta); }
.dash-btn:disabled { opacity: 0.5; cursor: default; }
.dash-controls { display: flex; gap: 16px; align-items: end; flex-wrap: wrap;
  background: var(--color-surface); border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 12px; padding: 16px 20px; margin: 0 0 24px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
.dash-controls label { display: flex; flex-direction: column; gap: 6px;
  font-size: 0.8rem; font-weight: 600; color: var(--color-neutral-text, #576478); }
.dash-controls select, .dash-controls input { min-height: 44px; padding: 8px 12px;
  border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 10px; font-size: 0.95rem;
  background: var(--color-surface); color: var(--color-text); cursor: pointer;
  transition: border-color 0.15s; }
.dash-controls select:hover, .dash-controls input:hover { border-color: rgba(0, 0, 0, 0.3); }
.dash-controls select:focus-visible, .dash-controls input:focus-visible,
#dash-key-input:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.dash-controls .note { color: var(--color-neutral-text, #576478); font-size: 0.85rem; align-self: center; }
#dash-key-screen { max-width: 400px; margin: 64px auto; display: flex; flex-direction: column;
  gap: 14px; background: var(--color-surface); border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 16px; padding: 32px 28px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06); }
#dash-key-screen label { font-size: 1.05rem; font-weight: 700; color: var(--color-text); }
#dash-key-input { min-height: 44px; padding: 10px 14px; border: 1px solid rgba(0, 0, 0, 0.15);
  border-radius: 10px; font-size: 1rem; }
.dash-banner { padding: 12px 16px; border-radius: 10px; margin: 0 0 16px;
  background: var(--color-surface); border: 1px solid rgba(0, 0, 0, 0.12);
  color: var(--color-text); font-size: 0.92rem; }
.dash-banner-error { border-color: var(--color-danger); border-left-width: 4px;
  color: var(--color-danger-text, #A11A1A); }
.dash-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.dash-tile { background: var(--color-surface); border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
.dash-tile .k { display: block; font-size: 0.8rem; font-weight: 600;
  color: var(--color-neutral-text, #576478); margin-bottom: 6px; }
.dash-tile .v { display: block; font-size: 1.7rem; font-weight: 700; line-height: 1.1;
  color: var(--color-text); font-variant-numeric: tabular-nums; }
.dash-block { margin: 0 0 20px; background: var(--color-surface);
  border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 12px;
  padding: 18px 20px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
.dash-block-head { display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
.dash-block h2 { font-size: 1rem; font-weight: 700; color: var(--color-text); margin: 0; }
.dash-block .note { color: var(--color-neutral-text, #576478); font-size: 0.9rem; margin: 10px 0 0; }
.dash-tablewrap { overflow-x: auto; border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 10px; }
.dash-block table { border-collapse: collapse; width: 100%; background: var(--color-surface); }
.dash-block th, .dash-block td { padding: 11px 16px; text-align: left; font-size: 0.9rem;
  border-bottom: 1px solid rgba(0, 0, 0, 0.06); color: var(--color-text); white-space: nowrap; }
.dash-block th { background: var(--color-bg); font-weight: 600; font-size: 0.82rem;
  color: var(--color-neutral-text, #576478); }
.dash-block tbody tr { transition: background 0.15s; }
.dash-block tbody tr:hover { background: var(--color-bg); }
.dash-block tr:last-child td { border-bottom: 0; }
.dash-num { text-align: right; font-variant-numeric: tabular-nums; }
.dash-danger { color: var(--color-danger-text, #A11A1A); font-weight: 700; }
.dash-integrity { border-left: 4px solid var(--color-danger); }
.dash-integrity h2 { color: var(--color-danger-text, #A11A1A); }
@media (max-width: 640px) {
  .dash-tiles { grid-template-columns: repeat(2, 1fr); }
  .dash-shell { padding: 0 12px 40px; }
  .dash-controls { padding: 14px 16px; gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .dash-btn, .dash-controls select, .dash-controls input, .dash-block tbody tr { transition: none; }
}
</style>
</head>
<body>
<noscript>이 페이지는 JavaScript가 필요합니다.</noscript>

<div class="dash-shell">
  <header class="dash-topbar">
    <h1>안전점검 대시보드</h1>
    <span id="dash-generated"></span>
    <span class="spacer"></span>
    <button type="button" class="dash-btn" id="btn-dash-refresh" hidden>새로고침</button>
    <button type="button" class="dash-btn" id="btn-dash-clearkey" hidden>키 지우기</button>
  </header>

  <div id="dash-banner" aria-live="polite"></div>

  <section id="dash-key-screen" hidden>
    <label for="dash-key-input">대시보드 키</label>
    <input type="password" id="dash-key-input" autocomplete="off"
           placeholder="관리자에게 받은 키를 입력하세요">
    <button type="button" class="dash-btn dash-btn-primary" id="btn-dash-keysave">열기</button>
  </section>

  <section id="dash-controls" class="dash-controls" hidden>
    <label>팀
      <select id="dash-team"></select>
    </label>
    <label>시작일
      <input type="date" id="dash-from">
    </label>
    <label>종료일
      <input type="date" id="dash-to">
    </label>
    <button type="button" class="dash-btn dash-btn-primary" id="btn-dash-query">조회</button>
    <span class="note">비우면 최근 30일</span>
  </section>

  <main id="dash-blocks"></main>
</div>

<script src="./config.js?v=0.5.5"></script>
<script src="./dashboard.js?v=0.5.5"></script>
</body>
</html>
